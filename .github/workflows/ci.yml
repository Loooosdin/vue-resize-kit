name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  vue-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - vue: '2.6.14'
            tests: 'tests/core.test.ts tests/directive.test.ts tests/vue-compatibility.test.ts'
          - vue: '2.7.16'
            tests: 'tests/core.test.ts tests/directive.test.ts tests/composable.test.ts tests/vue-compatibility.test.ts'
          - vue: '3.2.47'
            tests: 'tests/core.test.ts tests/directive.test.ts tests/composable.test.ts tests/vue-compatibility.test.ts'
          - vue: '3'
            tests: 'tests/core.test.ts tests/directive.test.ts tests/composable.test.ts tests/vue-compatibility.test.ts'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm add --save-dev vue@${{ matrix.vue }} --no-lockfile
      - run: pnpm exec vitest run ${{ matrix.tests }}
